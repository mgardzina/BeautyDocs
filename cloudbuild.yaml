steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/powder-brows-academy-pl:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/powder-brows-academy-pl:latest'
      - '.'
    timeout: 1200s

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/powder-brows-academy-pl:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/powder-brows-academy-pl:latest'

  # Update Database Schema (Proxy + Migration in one step)
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        apk add --no-cache openssl curl &&
        curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.0/cloud-sql-proxy.linux.amd64 &&
        chmod +x cloud-sql-proxy &&
        mkdir -p /cloudsql &&
        chmod 777 /cloudsql &&
        ./cloud-sql-proxy --unix-socket=/cloudsql powderbrowsacademypl:europe-west1:powderbrowspl-db &
        sleep 5 &&
        npm install prisma @prisma/client &&
        npx prisma db push --accept-data-loss
    env:
      - 'DATABASE_URL=postgresql://postgres:%3Es76s%29Qe-nO0soA%24@localhost/powderbrowsacademypl?host=/cloudsql/powderbrowsacademypl:europe-west1:powderbrowspl-db'

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'powder-brows-academy-pl'
      - '--image'
      - 'gcr.io/$PROJECT_ID/powder-brows-academy-pl:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--port'
      - '8080'


images:
  - 'gcr.io/$PROJECT_ID/powder-brows-academy-pl:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/powder-brows-academy-pl:latest'

timeout: 1800s

options:
  machineType: 'E2_HIGHCPU_8'
