server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl;
    http2 on;
    server_name beautydocs.pl;

    ssl_certificate /etc/letsencrypt/live/beautydocs.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beautydocs.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 16m;

    # Resolve the current container address after application recreations.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $beautydocs_upstream http://app:8080;

    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location / {
        proxy_pass $beautydocs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host beautydocs.pl;
        proxy_set_header X-Forwarded-Host beautydocs.pl;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
