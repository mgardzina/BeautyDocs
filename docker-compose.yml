name: beautydocs

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: beautydocs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.compose.local}
      BEAUTYDOCS_MIGRATOR_PASSWORD: ${BEAUTYDOCS_MIGRATOR_PASSWORD:?Set BEAUTYDOCS_MIGRATOR_PASSWORD}
      BEAUTYDOCS_APP_PASSWORD: ${BEAUTYDOCS_APP_PASSWORD:?Set BEAUTYDOCS_APP_PASSWORD}
    ports:
      - "127.0.0.1:${BEAUTYDOCS_DB_PORT:-5434}:5432"
    volumes:
      - sqlalchemy_database:/var/lib/postgresql/data
      - ./docker/postgres/init-beautydocs.sh:/docker-entrypoint-initdb.d/10-beautydocs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d beautydocs"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: beautydocs-api:${BEAUTYDOCS_IMAGE_TAG:-local}
    build: ./apps/api
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      BEAUTYDOCS_MIGRATION_DATABASE_URL: postgresql+asyncpg://beautydocs_migrator:${BEAUTYDOCS_MIGRATOR_PASSWORD:?Set BEAUTYDOCS_MIGRATOR_PASSWORD}@db:5432/beautydocs
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: beautydocs-api:${BEAUTYDOCS_IMAGE_TAG:-local}
    build: ./apps/api
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      BEAUTYDOCS_ENVIRONMENT: local
      BEAUTYDOCS_GOOGLE_CLIENT_ID: ${BEAUTYDOCS_GOOGLE_CLIENT_ID:-}
      BEAUTYDOCS_DATABASE_URL: postgresql+asyncpg://beautydocs_app:${BEAUTYDOCS_APP_PASSWORD:?Set BEAUTYDOCS_APP_PASSWORD}@db:5432/beautydocs
      BEAUTYDOCS_MIGRATION_DATABASE_URL: ""
      BEAUTYDOCS_LEGACY_SERVICE_KEY: ${BEAUTYDOCS_LEGACY_SERVICE_KEY:?Set BEAUTYDOCS_LEGACY_SERVICE_KEY}
      BEAUTYDOCS_AUTH_ALLOWED_ORIGINS: http://localhost:${BEAUTYDOCS_WEB_PORT:-3000}
      BEAUTYDOCS_CORS_ALLOWED_ORIGINS: http://localhost:${BEAUTYDOCS_WEB_PORT:-3000}
      BEAUTYDOCS_PUBLIC_WEB_URL: http://localhost:${BEAUTYDOCS_WEB_PORT:-3000}
      BEAUTYDOCS_CHAT_UPLOAD_DIRECTORY: /srv/api/.data/chat-attachments
    ports:
      - "127.0.0.1:${BEAUTYDOCS_API_PORT:-8080}:8080"
    volumes:
      - api_uploads:/srv/api/.data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: beautydocs-web:${BEAUTYDOCS_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${BEAUTYDOCS_WEB_PORT:-3000}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOSTNAME=0.0.0.0
      - BEAUTYDOCS_API_INTERNAL_URL=http://api:8080
      - BEAUTYDOCS_LEGACY_SERVICE_KEY=${BEAUTYDOCS_LEGACY_SERVICE_KEY:?Set BEAUTYDOCS_LEGACY_SERVICE_KEY}
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET}
      - AUTH_URL=http://localhost:${BEAUTYDOCS_WEB_PORT:-3000}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlalchemy_database:
  api_uploads:
